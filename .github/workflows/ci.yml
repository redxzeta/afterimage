name: CI

on:
  push:
    branches: [afterimage-main]
  pull_request:
    branches: [afterimage-main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full workspace suite on Linux, macOS and Windows
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_BUILD_JOBS: 2
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full == true && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          key: verify-${{ matrix.os }}-1.98.1
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/afterimage-main' }}
      - name: Benchmark isolation prerequisite
        if: runner.os == 'Linux'
        run: command -v bwrap || (sudo apt-get update && sudo apt-get install --yes bubblewrap)
      - name: Verify
        shell: bash
        env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERIFY_FULL: ${{ inputs.full == true && '1' || '0' }}
        run: python3 scripts/verify.py
      - name: Diagnose failed CLI fixture without rebuilding
        if: failure() && runner.os == 'Linux'
        run: python3 scripts/diagnose_cli.py
      - name: Compare actual CLI with controlled native bridge compiler
        if: failure() && runner.os == 'Linux'
        env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERIFY_FULL: ${{ inputs.full == true && '1' || '0' }}
        run: python3 scripts/diagnose_cli_compiler.py
